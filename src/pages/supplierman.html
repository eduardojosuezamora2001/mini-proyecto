<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administración de Proveedores | AdminPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/customers.css" />
  <link rel="stylesheet" href="../styles/unified-theme.css" />
  <link rel="stylesheet" href="../styles/crud-modal.css" />
  <link rel="stylesheet" href="../styles/ui-toolkit.css" />
  <link rel="stylesheet" href="../styles/admin-sidebar.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="supplier-page">
  <div class="app-shell">
    <admin-sidebar active="suppliers"></admin-sidebar>
    <main class="workspace">
      <header class="topbar"><label class="global-search"><i data-lucide="search"></i><input id="supplier-search" type="search" placeholder="Search suppliers..." /></label><div class="top-actions"><button class="icon-button" aria-label="Notificaciones"><i data-lucide="bell"></i><b></b></button><span class="user-photo supplier-user">AD</span></div></header>
      <section class="content">
        <div class="page-header"><div><h1>Administración de Proveedores</h1><p>Manage and monitor enterprise supplier relationships.</p></div><div class="header-actions"><button class="button secondary" id="export-suppliers"><i data-lucide="download"></i>Export</button><button class="button primary" id="add-supplier"><i data-lucide="plus"></i>Nuevo Proveedor</button></div></div>
        <section class="customer-card">
          <div class="table-toolbar"><strong>Directorio de proveedores</strong><label class="status-select"><select id="supplier-status"><option value="all">Todos los estados</option><option value="active">Activos</option><option value="inactive">Inactivos</option></select><i data-lucide="chevrons-up-down"></i></label></div>
          <div class="table-wrap"><table><thead><tr><th>Empresa</th><th>Contacto</th><th>Correo / Teléfono</th><th>Estado</th><th>Dirección</th><th class="actions-head">Acciones</th></tr></thead><tbody id="supplier-list"></tbody></table><p class="empty-state" hidden>No se encontraron proveedores.</p></div>
          <footer class="card-footer"><p>Showing <strong id="supplier-visible">0</strong> of <strong id="supplier-total">0</strong> suppliers</p><nav class="pagination" id="supplier-pagination"></nav></footer>
        </section>
      </section>
    </main>
  </div>
  <script src="../js/localStorage.js"></script>
  <script src="../js/datasetGenerator.js"></script>
  <script src="../js/dataBootstrap.js"></script>
  <script src="../js/businessLogic.js"></script>
  <script src="../js/appCore.js"></script>
  <script src="../js/uiToolkit.js"></script>
  <script src="../components/adminSidebar.js"></script>
  <script src="../js/crudModal.js"></script>
  <script src="../js/supplierman.js"></script>
</body>
</html>
