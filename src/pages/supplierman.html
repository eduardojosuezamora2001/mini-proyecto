
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AdminPro · Administración de Proveedores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles/supplierman.css">
</head>
<body>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-header">
          <div class="logo-icon" id="logo-icon"></div>
          <div class="brand">
            <p class="brand-name" id="brand-name"></p>
            <p class="brand-tagline" id="brand-tagline"></p>
          </div>
        </div>
        <button class="sidebar-close" id="sidebar-close" aria-label="Cerrar menú"></button>
      </div>

      <nav class="nav-main" id="nav-main" aria-label="Navegación principal"></nav>

      <div class="nav-footer" id="nav-footer"></div>
    </aside>

    <!-- Main column -->
    <div class="main-column">

      <header class="topbar">
        <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Abrir menú"></button>

        <div class="search-box">
          <span class="search-icon" id="search-icon"></span>
          <input type="text" id="search-input" class="search-input" autocomplete="off" />
        </div>

        <div class="topbar-actions">
          <button class="icon-button" id="notif-btn" aria-label="Notificaciones">
            <span id="bell-icon"></span>
            <span class="notif-dot" id="notif-dot" hidden></span>
          </button>
          <button class="avatar" id="user-avatar" aria-label="Cuenta de usuario"></button>
        </div>
      </header>

      <main class="content">

        <div class="page-heading">
          <div class="page-heading-text">
            <h2 class="page-title" id="page-title"></h2>
            <p class="page-subtitle" id="page-subtitle"></p>
          </div>
          <button class="btn btn-primary" id="primary-action"></button>
        </div>

        <section class="table-card">
          <div class="toolbar" id="toolbar"></div>

          <div class="table-wrapper">
            <table class="data-table">
              <thead id="table-head"></thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>

          <div class="table-footer">
            <p class="table-summary" id="table-summary"></p>
            <nav class="pagination" id="pagination" aria-label="Paginación"></nav>
          </div>
        </section>

      </main>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script src="/src/js/supplierman.js"></script>
</body>
</html>
