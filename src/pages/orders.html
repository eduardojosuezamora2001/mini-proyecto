<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedidos | AdminPro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/customers.css"><link rel="stylesheet" href="../styles/unified-theme.css"><link rel="stylesheet" href="../styles/orders.css"><script src="https://unpkg.com/lucide@latest"></script></head>
<body><div class="app-shell"><aside class="sidebar"><a class="brand" href="adminpanel.html"><span class="brand-mark">A</span><span><strong>AdminPro</strong><small>Enterprise ERP</small></span></a><nav class="side-nav">
<a class="nav-item" href="adminpanel.html"><i data-lucide="layout-grid"></i><span>Dashboard</span></a><a class="nav-item" href="customers.html"><i data-lucide="users"></i><span>Customers</span></a><a class="nav-item" href="products.html"><i data-lucide="archive"></i><span>Products</span></a><a class="nav-item" href="supplierman.html"><i data-lucide="factory"></i><span>Suppliers</span></a><a class="nav-item active" href="orders.html" aria-current="page"><i data-lucide="shopping-cart"></i><span>Orders</span></a></nav><a class="nav-item settings" href="configsystem.html"><i data-lucide="settings"></i><span>Settings</span></a></aside>
<main class="workspace"><header class="topbar"><label class="global-search"><i data-lucide="search"></i><input id="order-search" type="search" placeholder="Buscar pedidos o clientes..."></label><div class="role-pill" id="active-role"></div></header><section class="content"><div class="page-header"><div><h1>Pedidos</h1><p>Relaciona clientes, productos y proveedores.</p></div><button class="button primary" id="add-order"><i data-lucide="plus"></i>Nuevo Pedido</button></div>
<section class="customer-card"><div class="table-toolbar"><label class="status-select"><select id="order-status"><option value="all">Todos los estados</option><option value="pending">Pendiente</option><option value="processing">En proceso</option><option value="delivered">Entregado</option></select></label></div><div class="table-wrap"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Artículos</th><th>Proveedores</th><th>Total</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="order-list"></tbody></table><p class="empty-state" hidden>No hay pedidos coincidentes.</p></div><footer class="card-footer"><p><strong id="order-total">0</strong> pedidos</p><nav class="pagination" id="order-pagination"></nav></footer></section></section></main></div>
<dialog id="order-dialog" class="order-dialog"><form id="order-form"><header><h2>Nuevo pedido</h2><button type="button" id="close-order">×</button></header><label>Cliente<select id="order-customer" required></select></label><fieldset><legend>Productos y cantidades</legend><div id="order-products" class="order-products"></div></fieldset><div class="order-calculation"><span><b id="order-quantity">0</b> artículos</span><strong>Total: <span id="order-amount">$0.00</span></strong></div><p class="form-error" id="order-error"></p><footer><button type="button" class="button secondary" id="cancel-order">Cancelar</button><button type="submit" class="button primary">Guardar pedido</button></footer></form></dialog>
<script src="../js/localStorage.js"></script><script src="../js/datasetGenerator.js"></script><script src="../js/dataBootstrap.js"></script><script src="../js/businessLogic.js"></script><script src="../js/appCore.js"></script><script src="../js/orders.js"></script></body></html>
