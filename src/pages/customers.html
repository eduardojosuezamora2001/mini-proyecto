<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administración de Clientes | AdminPro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/customers.css" />
  <link rel="stylesheet" href="../styles/unified-theme.css" />
  <link rel="stylesheet" href="../styles/crud-modal.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../styles/navigation.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="adminpanel.html" aria-label="AdminPro">
        <span class="brand-mark">A</span>
        <span><strong>AdminPro</strong><small>Enterprise ERP</small></span>
      </a>
      <nav class="side-nav" aria-label="Navegación principal">
        <a class="nav-item" href="adminpanel.html"><i data-lucide="layout-grid"></i><span>Dashboard</span></a>
        <a class="nav-item active" href="customers.html" aria-current="page"><i data-lucide="users-round"></i><span>Customers</span></a>
        <a class="nav-item" href="products.html"><i data-lucide="archive"></i><span>Products</span></a>
        <a class="nav-item" href="supplierman.html"><i data-lucide="factory"></i><span>Suppliers</span></a>
        <a class="nav-item" href="orders.html"><i data-lucide="shopping-cart"></i><span>Orders</span></a>
      </nav>
      <a class="nav-item settings" href="configsystem.html"><i data-lucide="settings"></i><span>Settings</span></a>
    </aside>

<body data-page="customers">
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <main class="workspace">
      <header class="topbar">
        <label class="global-search"><i data-lucide="search"></i><input type="search"
            placeholder="Search customers..." /></label>
        <div class="top-actions">
          <button class="icon-button" aria-label="Notificaciones"><i data-lucide="bell"></i><b></b></button>
          <img class="user-photo" src="https://i.pravatar.cc/80?img=12" alt="Perfil de usuario" />
        </div>
      </header>

      <section class="content">
        <div class="page-header">
          <div>
            <h1>Administración de Clientes</h1>
            <p>Manage your customer database, view statuses, and add new clients.</p>
          </div>
          <div class="header-actions">
            <button class="button secondary"><i data-lucide="download"></i>Export</button>
            <button class="button primary" id="add-customer"><i data-lucide="plus"></i>Nuevo Cliente</button>
          </div>
        </div>

        <section class="customer-card">
          <div class="table-toolbar">
            <label class="customer-search"><i data-lucide="search"></i><input id="customer-search" type="search"
                placeholder="Search by name or email..." /></label>
            <div class="filter-actions">
              <label class="status-select"><select id="status-filter">
                  <option value="all">All Statuses</option>
                  <option value="active">Active</option>
                  <option value="pending">Pending</option>
                  <option value="inactive">Inactive</option>
                </select><i data-lucide="chevrons-up-down"></i></label>
              <button class="filter-button" aria-label="Más filtros"><i data-lucide="list-filter"></i></button>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead><tr><th><input type="checkbox" id="select-all" aria-label="Seleccionar todos" /></th><th>Name</th><th>Email</th><th>Status</th><th>Last Order</th><th class="actions-head">Actions</th></tr></thead>
              <tbody id="customer-list"></tbody>
            </table>
            <p class="empty-state" hidden>No customers match your search.</p>
          </div>

          <footer class="card-footer">
            <p>Showing <strong id="visible-count">0</strong> of <strong id="customer-total">0</strong> customers</p>
            <nav class="pagination" aria-label="Paginación"><button disabled><i data-lucide="chevron-left"></i></button><button class="current">1</button><button>2</button><button>3</button><span>...</span><button>10</button><button><i data-lucide="chevron-right"></i></button></nav>
          </footer>
        </section>
      </section>
    </main>
  </div>
  <script src="../js/localStorage.js"></script>
  <script src="../js/datasetGenerator.js"></script>
  <script src="../js/dataBootstrap.js"></script>
  <script src="../js/businessLogic.js"></script>
  <script src="../js/appCore.js"></script>
  <script src="../js/crudModal.js"></script>
  <script src="../js/customers.js"></script>
  <script src="../js/navigation.js" defer></script>
</body>
</html>
