<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdminPro — Administración de Productos</title>
  <link rel="stylesheet" href="../styles/products.css" />
  <link rel="stylesheet" href="../styles/unified-theme.css" />
  <link rel="stylesheet" href="../styles/crud-modal.css" />
</head>
<body>

  <div class="app-shell">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">AP</div>
        <div class="brand-text">
          <span class="brand-name">AdminPro</span>
          <span class="brand-sub">Enterprise ERP</span>
        </div>
      </div>

      <nav>
        <ul class="nav-list">
          <li>
            <a href="adminpanel.html" data-nav="dashboard">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                <rect x="14" y="14" width="7" height="7" rx="1"></rect>
              </svg>
              <span>Dashboard</span>
            </a>
          </li>
          <li>
            <a href="customers.html" data-nav="customers">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
              <span>Customers</span>
            </a>
          </li>
          <li>
            <a href="products.html" data-nav="products" class="active" aria-current="page">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
              </svg>
              <span>Products</span>
            </a>
          </li>
          <li>
            <a href="supplierman.html" data-nav="suppliers">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="1" y="3" width="15" height="13"></rect>
                <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                <circle cx="5.5" cy="18.5" r="2.5"></circle>
                <circle cx="18.5" cy="18.5" r="2.5"></circle>
              </svg>
              <span>Suppliers</span>
            </a>
          </li>
          <li><a href="orders.html" data-nav="orders"><span style="font-size:18px">☷</span><span>Orders</span></a></li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <a href="configsystem.html" data-nav="settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>Settings</span>
        </a>
      </div>
    </aside>

    <!-- ============ MAIN AREA ============ -->
    <div class="main-area">

      <!-- Top bar -->
      <header class="top-bar">
        <div class="search-global">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" placeholder="Search across AdminPro..." />
        </div>

        <div class="top-bar-actions">
          <button class="icon-btn" aria-label="Notificaciones">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </button>
          <div class="user-avatar">
            <img src="https://i.pravatar.cc/72?img=47" alt="Foto de perfil" />
          </div>
        </div>
      </header>

      <!-- Content -->
      <main class="content">

        <div class="page-header">
          <div>
            <h1>Administración de Productos</h1>
            <p class="text-muted">Manage your inventory, pricing, and product details.</p>
          </div>
          <div class="page-header-actions">
            <button class="btn btn-secondary" id="filters-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
              </svg>
              Filters
            </button>
            <button class="btn btn-primary" id="add-product-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              Añadir Producto
            </button>
          </div>
        </div>

        <section class="card table-card">

          <div class="table-toolbar">
            <div class="search-local">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" id="product-search" placeholder="Search products..." />
            </div>

            <div class="view-toggle" role="group" aria-label="Vista de tabla">
              <button class="view-btn" data-view="list" aria-label="Vista de lista">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="4" rx="1"></rect>
                  <rect x="3" y="10" width="18" height="4" rx="1"></rect>
                  <rect x="3" y="16" width="18" height="4" rx="1"></rect>
                </svg>
              </button>
              <button class="view-btn active" data-view="grid" aria-label="Vista de cuadrícula">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                  <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                  <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                  <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                </svg>
              </button>
            </div>
          </div>

          <table class="product-table">
            <thead>
              <tr>
                <th>Product</th>
                <th>Category</th>
                <th class="align-right">Price</th>
                <th class="align-right">Stock</th>
                <th>Status</th>
                <th class="align-right">Actions</th>
              </tr>
            </thead>
            <tbody id="product-table-body">
              <!-- Filas generadas por js/script.js -->
            </tbody>
          </table>

          <div class="table-footer">
            <p class="text-muted" id="results-summary">Showing 1 to 3 of 150 products</p>
            <div class="pagination" id="pagination">
              <button class="page-btn" data-page="prev" aria-label="Página anterior">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
              </button>
              <button class="page-btn active" data-page="1">1</button>
              <button class="page-btn" data-page="2">2</button>
              <button class="page-btn" data-page="3">3</button>
              <button class="page-btn" data-page="next" aria-label="Página siguiente">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>
            </div>
          </div>

        </section>

      </main>
    </div>
  </div>

  <script src="../js/localStorage.js"></script>
  <script src="../js/datasetGenerator.js"></script>
  <script src="../js/dataBootstrap.js"></script>
  <script src="../js/businessLogic.js"></script>
  <script src="../js/appCore.js"></script>
  <script src="../js/crudModal.js"></script>
  <script src="../js/products.js"></script>
</body>
</html>
