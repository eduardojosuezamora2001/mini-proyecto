<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdminPro — Administración de Productos</title>
  <link rel="stylesheet" href="../styles/products.css" />
  <link rel="stylesheet" href="../styles/navigation.css">
</head>

<body>

  <div class="app-shell">
    <aside id="sidebar"></aside>

    <!-- ============ MAIN AREA ============ -->
    <div class="main-area">

      <!-- Top bar -->
      <header class="top-bar">
        <div class="search-global">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" placeholder="Search across AdminPro..." />
        </div>

        <div class="top-bar-actions">
          <button class="icon-btn" aria-label="Notificaciones">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </button>
          <div class="user-avatar">
            <img src="https://i.pravatar.cc/72?img=47" alt="Foto de perfil" />
          </div>
        </div>
      </header>

      <!-- Content -->
      <main class="content">

        <div class="page-header">
          <div>
            <h1>Administración de Productos</h1>
            <p class="text-muted">Manage your inventory, pricing, and product details.</p>
          </div>
          <div class="page-header-actions">
            <button class="btn btn-secondary" id="filters-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
              </svg>
              Filters
            </button>
            <button class="btn btn-primary" id="add-product-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              Añadir Producto
            </button>
          </div>
        </div>

        <section class="card table-card">

          <div class="table-toolbar">
            <div class="search-local">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input type="text" id="product-search" placeholder="Search products..." />
            </div>

            <div class="view-toggle" role="group" aria-label="Vista de tabla">
              <button class="view-btn" data-view="list" aria-label="Vista de lista">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="4" rx="1"></rect>
                  <rect x="3" y="10" width="18" height="4" rx="1"></rect>
                  <rect x="3" y="16" width="18" height="4" rx="1"></rect>
                </svg>
              </button>
              <button class="view-btn active" data-view="grid" aria-label="Vista de cuadrícula">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                  <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                  <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                  <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                </svg>
              </button>
            </div>
          </div>

          <table class="product-table">
            <thead>
              <tr>
                <th>Product</th>
                <th>Category</th>
                <th class="align-right">Price</th>
                <th class="align-right">Stock</th>
                <th>Status</th>
                <th class="align-right">Actions</th>
              </tr>
            </thead>
            <tbody id="product-table-body">
              <!-- Filas generadas por js/script.js -->
            </tbody>
          </table>

          <div class="table-footer">
            <p class="text-muted" id="results-summary">Showing 1 to 3 of 150 products</p>
            <div class="pagination" id="pagination">
              <button class="page-btn" data-page="prev" aria-label="Página anterior">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
              </button>
              <button class="page-btn active" data-page="1">1</button>
              <button class="page-btn" data-page="2">2</button>
              <button class="page-btn" data-page="3">3</button>
              <button class="page-btn" data-page="next" aria-label="Página siguiente">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>
            </div>
          </div>

        </section>

      </main>
    </div>
  </div>

  <script src="../js/products.js"></script>
  <script src="../js/navigation.js" defer></script>
</body>

</html>
